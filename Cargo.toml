[package]
name = "msrec"
version = "0.1.0"
edition = "2024"
description = "Wrapper for API of Monster Siren Records music service."
license = "MIT"
authors = ["Kirill Aldashkin"]
repository = "https://github.com/KirillAldashkin/RustMsrApi"

[dependencies]
serde = { version = "1.0.229", default-features = false, optional = true }
url = { version = "2.5.8", default-features = false }
reqwest = { version = "0.13.5", default-features = false, optional = true }

[features]
serde = ["dep:serde", "serde/serde_derive", "serde/alloc", "url/serde"]
reqwest = ["dep:reqwest", "reqwest/json", "serde"]

[dev-dependencies]
reqwest = "0.13.5"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "real_fetch"
path = "examples/real_fetch.rs"
required-features = ["reqwest"]
